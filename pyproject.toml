[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "-v",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]  # Workers require a live broker; covered by integration tests.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI uses function calls in default arguments
    "UP007",  # Allow Optional for pydantic compat where needed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
